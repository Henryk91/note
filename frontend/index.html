<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0079ae" />
    <script>
      // Apply the saved theme before the app loads, so the page and the installed app's title bar match from the
      // first paint (same colours as THEME_BARS in src/shared/utils/Helpers/storage.ts).
      (function () {
        try {
          var bars = { Dark: '#0079ae', Ocean: '#35373d', Green: '#103762', Night: '#27343b', Red: '#bb3b00', Monokai: '#1e1f1c' };
          var t = localStorage.getItem('theme') || 'Dark';
          document.documentElement.setAttribute('data-theme', t.toLowerCase());
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[t] || bars.Dark);
        } catch (e) {}
      })();
    </script>
    <meta name="Description" content="Quick and easy weather app" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <title>Notes List</title>
  </head>
  <body>
    <noscript>
      <p>Please enable JavaScript for this page to function</p>
    </noscript>
    <div id="root" class="page-content-top"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
